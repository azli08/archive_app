services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collectly}
      POSTGRES_USER: ${POSTGRES_USER:-collectly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collectly}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - collectly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collectly} -d ${POSTGRES_DB:-collectly}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collectly_postgres_data:
